ci:
  autoupdate_schedule: "quarterly"

default_language_version:
  python: "python3.14"

repos:
  - repo: "meta"
    hooks:
      - id: "check-hooks-apply"
      - id: "check-useless-excludes"

  - repo: "https://github.com/pre-commit/pre-commit-hooks"
    rev: "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c"  # frozen: v6.0.0
    hooks:
      - id: "check-added-large-files"
      - id: "check-merge-conflict"
      - id: "check-json"
      - id: "check-yaml"
      - id: "end-of-file-fixer"
      - id: "mixed-line-ending"
        args:
          - "--fix=lf"
      - id: "trailing-whitespace"

  - repo: "https://github.com/asottile/pyupgrade"
    rev: "75992aaa40730136014f34227e0135f63fc951b4"  # frozen: v3.21.2
    hooks:
      - id: "pyupgrade"
        name: "Enforce Python 3.14+ idioms"
        args:
          - "--py314-plus"

  - repo: "https://github.com/psf/black-pre-commit-mirror"
    rev: "4160603246a6b365d4a2af661c6d71b0a0f50478"  # frozen: 26.5.1
    hooks:
      - id: "black"

  - repo: "https://github.com/pycqa/isort"
    rev: "131f4adcd5582bfc53928ab0d740eceb8b506b6c"  # frozen: 9.0.1
    hooks:
      - id: "isort"

  - repo: "https://github.com/pycqa/flake8"
    rev: "31405090a83cade9350502e481dcd1f032cb50b9"  # frozen: 7.4.0
    hooks:
      - id: "flake8"
        additional_dependencies:
          - "flake8-toml-config==1.1.0"
          - "flake8-bugbear==26.9.30"

  - repo: "https://github.com/editorconfig-checker/editorconfig-checker"
    rev: "0adfdb012938ada0cf563a40f2fceaf9466290ca"  # frozen: v4.0.2
    hooks:
      - id: "editorconfig-checker"

  - repo: "https://github.com/python-jsonschema/check-jsonschema"
    rev: "99f2dd369364da7ed3ac536504132b3db2e7a3b1"  # frozen: 0.38.1
    hooks:
      - id: "check-dependabot"
      - id: "check-github-workflows"
      - id: "check-metaschema"
        files: "src/.+-schema.json"

  - repo: "https://github.com/adhtruong/mirrors-typos"
    rev: "055a23723277d32b55190e5f71a82d398b8e32c2"  # frozen: v1.50.2
    hooks:
      - id: "typos"

  - repo: "local"
    hooks:
      - id: "render-workflow-templates"
        name: "Render workflow templates"
        language: "python"
        entry: "python src/render-templates.py"
        always_run: true
        pass_filenames: false
        additional_dependencies:
          # The dependencies here are injected from a lock file
          # when `tox run -e update-requirements` is run.
          # DO NOT edit these dependencies manually.
          #
          # additional_dependencies source: requirements/templating/requirements.txt
          - 'jinja2==3.1.6 ; python_version == "3.14"'
          - 'markupsafe==3.0.4 ; python_version == "3.14"'

  - repo: "https://github.com/zizmorcore/zizmor-pre-commit"
    rev: "fa412071e4f5d44d44f9e365f4676f9df92456a2"  # frozen: v1.30.1
    hooks:
    - id: "zizmor"

  - repo: "https://github.com/rhysd/actionlint"
    rev: "914e7df21a07ef503a81201c76d2b11c789d3fca"  # frozen: v1.7.12
    hooks:
      - id: "actionlint"
        additional_dependencies:
          - "github.com/wasilibs/go-shellcheck/cmd/shellcheck@4e7020840c303923eb1ab846fc446d77be892570"
        args: [
          # Awaiting update
          '-ignore',
          'reusable workflow call "\$/.+?" at "uses" is not following the format',
          # Awaiting update
          '-ignore',
          'label "ubuntu-26.04" is unknown',
        ]
